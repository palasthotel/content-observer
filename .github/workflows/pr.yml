name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-pr.yml@v1
    with:
      slug: content-observer
      dev-plugin-name: Content Observer - DEV
      # Requires PHP: 8.0
      php-versions: '["8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]'
      # public/dist and public/vendor are not in the repository; the pipeline builds them
      build-command: npm ci && npm run build
      # what the plugin loads, so a renamed build output fails here instead of
      # 404ing in wp-admin
      required-files: |
        vendor/autoload.php
        dist/modifications.js
        dist/modifications.asset.php
        dist/settings.js
        dist/settings.asset.php
